name: Build desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pyinstaller cryptography qrcode pillow

      - name: Protocol tests
        run: python desktop/test_loopback.py

      - name: Build
        run: pyinstaller --onefile --windowed --name DropSwift-Desktop --paths desktop desktop/dropswift_desktop.py

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: copy dist\DropSwift-Desktop.exe DropSwift-Desktop-Windows.exe

      - name: Pack (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/DropSwift-Desktop.app DropSwift-Desktop-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            DropSwift-Desktop-Windows.exe
            DropSwift-Desktop-Mac.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: DropSwift Desktop test build ${{ github.run_number }}
          files: out/*
